# Copy this to config.toml (gitignored) and adjust as needed.
# Every provider's API key comes from an env var, never from this file.

[server]
host = "0.0.0.0"
port = 8080
# Ceiling on an inbound request body, in bytes, enforced before a handler
# ever parses it. axum's Json/Bytes extractors already refuse anything
# over 2 MB even with this left at its default, but 2 MB is tight for a
# legitimate multimodal request -- an inline base64-encoded image/PDF
# alone adds ~33% overhead over its raw size.
# max_body_bytes = 20971520  # 20 MiB, this is the default
# Uncomment to require clients to send `Authorization: Bearer <token>`
# where <token> is the value of the named env var. Any key from
# `[[clients]]` below also authenticates, independent of this field.
# api_key_env = "RUSTY_PROVIDER_API_KEY"
# Requests-per-minute limit for callers not matched to a `[[clients]]`
# entry, bucketed by source IP. Unset (the default) means no limit for
# such callers — rate limiting is entirely opt-in.
# default_rate_limit_rpm = 60
# Uncomment to enable the admin API (GET /v1/admin/clients, POST
# /v1/admin/clients/{name}/reset-spend), unlocked by this separate token --
# a client key that authenticates chat completions does NOT also unlock
# this. Leaving it unset disables the admin API entirely (404s, as if the
# routes didn't exist).
# admin_key_env = "RUSTY_PROVIDER_ADMIN_KEY"
# Ceiling on requests being handled at once, server-wide, across every
# caller and route -- distinct from default_rate_limit_rpm/
# [[clients]].requests_per_minute above, which bound one caller's rate but
# not the total in-flight count. A request past this cap gets 503
# immediately rather than queuing. Unset (the default) means no cap.
# max_concurrent_requests = 200
# Restricts CORS to an explicit browser-origin allowlist. Unset (the
# default) preserves the original any-origin behavior
# (Access-Control-Allow-Origin: *).
# cors_allowed_origins = ["https://my-dashboard.example"]

# --- JWT/OIDC auth (optional) ------------------------------------------------
# An additional way to authenticate, alongside (never instead of) api_key_env/
# [[clients]] above -- a bearer token that doesn't match a known static key is
# tried as a JWT before being rejected. Fails closed: an expired/malformed/
# wrong-issuer token or an unreachable JWKS endpoint all mean "not
# authenticated," never "let it through anyway." See the README's "JWT/OIDC
# authentication" section for the full contract.

# [jwt]
# Simplest setup -- a shared secret, no network call ever needed:
# hs256_secret_env = "JWT_SECRET"
#
# Or real OIDC provider integration (Auth0, Okta, Keycloak, ...) instead --
# if both this and hs256_secret_env resolve, HS256 wins:
# jwks_url = "https://your-idp.example.com/.well-known/jwks.json"
# jwks_cache_secs = 300   # optional, this is the default
#
# issuer = "https://your-idp.example.com/"   # optional -- verified against `iss` if set
# audience = "rusty-provider"                # optional -- verified against `aud` if set
#
# Optional: map a claim to a [[clients]] name (a match resolves that
# client's budget/rate-limit/usage identity for the rest of the request;
# no match falls back to the same unmapped access a static shared key gets):
# client_claim = "sub"

# --- MCP (optional) ----------------------------------------------------------
# Exposes rusty_provider's own routing as MCP tools, and/or proxies other MCP
# servers' tools through the same endpoint. Mounted inside this same app and
# guarded by the same api_key_env/[[clients]]/[jwt] auth above -- not a
# separate auth model to configure. See docs/MCP.md for the full walkthrough.

# [mcp]
# enabled = true
# path = "/mcp"   # optional, this is the default
# A dropped upstream connection (subprocess crash, HTTP network blip) is
# redialed automatically with doubling backoff -- only applies once an
# upstream has connected at least once; a startup failure stays absent
# until restart. All three below are optional, defaults shown.
# reconnect_backoff_secs = 1
# reconnect_backoff_max_secs = 60
# max_reconnect_attempts = 10   # unset (the default) retries forever
#
# [[mcp.upstreams]]
# name = "filesystem"
# transport = "stdio"
# command = "npx"
# args = ["-y", "@modelcontextprotocol/server-filesystem", "/tmp"]
#
# [[mcp.upstreams]]
# name = "example"
# transport = "http"
# url = "https://mcp.example.com/mcp"
# bearer_token_env = "EXAMPLE_MCP_TOKEN"   # optional

# --- Providers -------------------------------------------------------------
# `kind` is one of: "openai" (any OpenAI-compatible /chat/completions API),
# "anthropic", or "gemini". A provider is skipped at startup (with a warning)
# if its api_key_env isn't set, so it's fine to leave providers you don't
# use in this file.
#
# `zdr` (default false) self-declares that you have a Zero Data Retention
# agreement with this provider — the router trusts this flag and never
# verifies it against the provider. Only consulted for requests that set
# `"provider": {"zdr": true}`. Confirm your actual contract terms with the
# provider before relying on this for anything sensitive.
#
# `no_training` (default false) self-declares that this provider does not
# use submitted data to train its models — a separate axis from `zdr`: a
# provider can retain data without training on it, or train on it without
# retaining it beyond the request. Only consulted for requests that set
# `"provider": {"data_collection": true}`. Same trust model as `zdr` —
# self-declared, never verified.
#
# `requests_per_minute` (optional) self-throttles this router's own calls
# to that provider, so it doesn't exceed limits it already knows about and
# get 429'd/banned. When the bucket is empty, the router treats it exactly
# like a retryable provider error and falls back to the next candidate in
# the chain — it does not queue/wait.
#
# A request can bring its own key for a configured provider instead of using
# this file's api_key_env, via `"provider": {"byok": {"openai": "sk-..."}}`
# -- the provider still needs a [providers.X] entry here (for kind/base_url),
# this only swaps the credential. See the README's "BYOK" section.

[providers.openai]
kind = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
# zdr = true
# no_training = true
# requests_per_minute = 500
# Total per-request timeout in seconds (connect + send + read the full
# response, including a streamed one). Defaults to 300 -- generous enough
# for a slow completion or a long-running stream, but still bounds a
# connection that hangs forever.
# timeout_secs = 300

[providers.anthropic]
kind = "anthropic"
base_url = "https://api.anthropic.com"
api_key_env = "ANTHROPIC_API_KEY"
# zdr = true
# no_training = true

[providers.gemini]
kind = "gemini"
base_url = "https://generativelanguage.googleapis.com"
api_key_env = "GEMINI_API_KEY"

[providers.groq]
kind = "openai"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"

[providers.together]
kind = "openai"
base_url = "https://api.together.xyz/v1"
api_key_env = "TOGETHER_API_KEY"

[providers.fireworks]
kind = "openai"
base_url = "https://api.fireworks.ai/inference/v1"
api_key_env = "FIREWORKS_API_KEY"

